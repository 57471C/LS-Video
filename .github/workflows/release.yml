name: Release LS.Video

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ffmpeg_asset: ffmpeg-x86_64-pc-windows-msvc.exe

          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ffmpeg_asset: ffmpeg-x86_64-unknown-linux-gnu

          # v0.6.3+: macOS + signing + autoupdate
          # - platform: macos-latest
          #   target: aarch64-apple-darwin
          #   ffmpeg_asset: ffmpeg-aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install WebKit2GTK (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Download ffmpeg sidecar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          gh release download ffmpeg-n9.0-lsvideo \
            --repo "${{ github.repository }}" \
            --pattern "${{ matrix.ffmpeg_asset }}" \
            --dir src-tauri/binaries
          chmod +x "src-tauri/binaries/${{ matrix.ffmpeg_asset }}" || true
          ls -la src-tauri/binaries/

      # v0.6.3+: Import Apple certificate (requires secrets on this repo)
      # - name: Import Apple certificate
      #   if: matrix.platform == 'macos-latest'
      #   ...

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v0.6.3+: TAURI_SIGNING_* and APPLE_* for updater + Mac
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LS.Video ${{ github.ref_name }}'
          releaseBody: 'Windows + Linux installers. macOS and autoupdate planned for 0.6.3. FFmpeg from ffmpeg-n9.0-lsvideo.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          retryAttempts: 3